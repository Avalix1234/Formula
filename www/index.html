<style>

</section>
<footer>Formula • Справочник школьных формул</footer>

const formulas = raw.trim().split('\n').map((line,i)=>{const p=line.split('|');return {id:i+1,title:p[0],eq:p[1],vars:p[2],example:p[3],subject:p[4],grade:p[5],section:p[6]};});
const $=id=>document.getElementById(id);
const read=(key,def)=>{try{return JSON.parse(localStorage.getItem(key))??def}catch{return def}};
let favorites=read('formula_favorites',[]), history=read('formula_history',[]), activeTab='catalog';
const save=()=>{localStorage.setItem('formula_favorites',JSON.stringify(favorites));localStorage.setItem('formula_history',JSON.stringify(history));};
function card(f){return `<article class="formula"><div class="fhead"><div class="ftitle">${f.title}</div><span class="tag">${f.subject} · ${f.grade} кл.</span></div><div class="equation">${f.eq}</div><div class="detail"><b>Обозначения:</b> ${f.vars}</div><div class="detail"><b>Пример:</b> ${f.example}</div><div class="detail"><b>Раздел:</b> ${f.section}</div><div class="actions"><button class="fav ${favorites.includes(f.id)?'on':''}" data-fav="${f.id}" aria-label="В избранное">${favorites.includes(f.id)?'★':'☆'}</button></div></article>`}
function showCards(list,target,empty){$(target).innerHTML=list.length?list.map(card).join(''):`<div class="empty">${empty}</div>`}
function renderCatalog(){const q=$('search').value.toLowerCase().trim(),s=$('subject').value,g=$('grade').value,sec=$('sectionFilter').value;const list=formulas.filter(f=>(!s||f.subject===s)&&(!g||f.grade===g)&&(!sec||f.section===sec)&&(!q||[f.title,f.eq,f.vars,f.example,f.subject,f.section].join(' ').toLowerCase().includes(q)));$('count').textContent=`Найдено: ${list.length} из ${formulas.length}`;showCards(list,'formulaGrid','Ничего не найдено. Попробуйте изменить запрос или фильтры.')}
function renderFavorites(){const list=formulas.filter(f=>favorites.includes(f.id));$('favCount').textContent=list.length;showCards(list,'favoriteGrid','Здесь пока пусто. Добавляйте формулы кнопкой ☆.')}
function renderHistory(){$('historyList').innerHTML=history.length?history.map(id=>{const f=formulas.find(x=>x.id===id);return f?`<div class="historyitem">${f.title} <span style="color:var(--muted)">— ${f.subject}, ${f.grade} класс</span></div>`:''}).join(''):'<div class="detail">Вы ещё не открывали формулы.</div>'}
function render(){renderCatalog();renderFavorites();renderHistory()}
function setTab(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===tab));if(tab==='favorites')renderFavorites();if(tab==='history')renderHistory()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
['search','subject','grade','sectionFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderCatalog));
const sections=[...new Set(formulas.map(f=>f.section))].sort();sections.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;$('sectionFilter').append(o)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-fav]');if(!b)return;const id=Number(b.dataset.fav);favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render();});
document.addEventListener('click',e=>{const c=e.target.closest('.formula');if(!c||e.target.closest('button'))return;const title=c.querySelector('.ftitle')?.textContent;const f=formulas.find(x=>x.title===title);if(f){history=[f.id,...history.filter(x=>x!==f.id)].slice(0,30);save();}});
$('clearHistory').onclick=()=>{history=[];save();renderHistory()};
$('themeBtn').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('formula_theme',next);};
document.documentElement.dataset.theme=localStorage.getItem('formula_theme')||'light';
document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{const a=Number($('a').value),c=Number($('b').value),op=b.dataset.op;if($('a').value===''||$('b').value===''){$('basicResult').textContent='Введите оба числа';return}if(op==='/'&&c===0){$('basicResult').textContent='На ноль делить нельзя';return}const r=op==='+'?a+c:op==='-'?a-c:op==='*'?a*c:a/c;$('basicResult').textContent=`Результат: ${Number(r.toPrecision(12))}`});
$('percentBtn').onclick=()=>{const a=Number($('percentBase').value),p=Number($('percentValue').value);if($('percentBase').value===''||$('percentValue').value===''){$('percentResult').textContent='Заполните оба поля';return}$('percentResult').textContent=`${p}% от ${a} = ${a*p/100}`};
$('distanceBtn').onclick=()=>{const v=Number($('speed').value),t=Number($('time').value);if($('speed').value===''||$('time').value===''){$('distanceResult').textContent='Заполните оба поля';return}$('distanceResult').textContent=`Путь: ${v*t} м`};
render();
</script>
